[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "product-scout"
version = "0.1.0"
description = "A local-first topic pool for creators: find trending tools and products, score them for video potential, and never miss the window."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
  "certifi",  # some Python installs ship a CA store too old for api.github.com
]
keywords = ["github-trending", "hacker-news", "huggingface", "content-creator", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]  # only needed to use Claude

[project.scripts]
product-scout = "product_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_scout = ["web/*", "defaults/*", "defaults/prompts/*"]
